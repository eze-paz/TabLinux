<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TabLinux — browser benchmark</title>
<style>
  :root { --bg:#0c0c0c; --fg:#d0d0d0; --dim:#6b7280; --accent:#9ecbff; --good:#4e9a06; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 ui-monospace,"Cascadia Mono",Consolas,monospace; padding:16px; }
  h1 { font-size:16px; color:var(--accent); font-weight:600; margin:0 0 4px; }
  p.sub { color:var(--dim); margin:0 0 14px; font-size:12px; }
  button { font:inherit; color:var(--fg); background:#1e1e28; border:1px solid #2a2a35;
           border-radius:5px; padding:6px 14px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  label { color:var(--dim); font-size:12px; margin-left:12px; }
  input[type=number]{ font:inherit; width:52px; background:#1e1e28; color:var(--fg);
                      border:1px solid #2a2a35; border-radius:4px; padding:2px 5px; }
  #status { color:var(--dim); font-size:12px; margin:10px 0; min-height:1.4em; }
  table { border-collapse:collapse; margin:12px 0; width:100%; max-width:720px; }
  th,td { text-align:left; padding:5px 12px 5px 0; border-bottom:1px solid #22222c; }
  th { color:var(--dim); font-weight:400; font-size:12px; }
  td.n { text-align:right; font-variant-numeric:tabular-nums; }
  .win { color:var(--good); }
  #log { white-space:pre-wrap; color:var(--dim); font-size:11px; margin-top:14px;
         max-height:180px; overflow:auto; border-top:1px solid #22222c; padding-top:8px; }
</style>
</head>
<body>
<h1>TabLinux — browser-path benchmark</h1>
<p class="sub">Real path: snapshot restore, JIT, MessageChannel pump, jitcache. Wall-clock to a marker, interleaved medians (the box has ~1.75× noise, so single runs lie).</p>
<div>
  <button id="run" disabled>Run benchmark</button>
  <label>reps <input id="reps" type="number" min="3" max="21" value="5"></label>
</div>
<div id="status">loading engine…</div>
<table id="results" hidden><thead><tr><th>task</th><th class="n">median</th><th class="n">min</th><th class="n">max</th><th>notes</th></tr></thead><tbody></tbody></table>
<div id="log"></div>

<script type="module">
const $ = id => document.getElementById(id);
const log = m => { const l = $("log"); l.textContent += m + "\n"; l.scrollTop = l.scrollHeight; };
const status = m => { $("status").textContent = m; };
const median = a => { const s = [...a].sort((x,y)=>x-y); return s[Math.floor(s.length/2)]; };
const fmt = ms => ms >= 1000 ? (ms/1000).toFixed(2)+"s" : Math.round(ms)+"ms";

// The real worker — same engine the terminal uses.
const worker = new Worker("./vm-worker.js", { type: "module" });
let buf = "";               // rolling console text
let lastOut = performance.now();
worker.onmessage = e => {
    const m = e.data;
    if (m.console) { buf += new TextDecoder().decode(m.console); lastOut = performance.now(); if (buf.length > 200000) buf = buf.slice(-100000); }
    if (m.status) log("[status] " + m.status);
    if (m.stat) log(`[stat] pvHits=${m.stat.pvHits} steps=${m.stat.steps}`);
};
worker.onerror = e => log("[worker error] " + (e.message || e.filename + ":" + e.lineno));
const send = s => { const b = new TextEncoder().encode(s); worker.postMessage({ input: b }, [b.buffer]); };
const sleep = ms => new Promise(r => setTimeout(r, ms));

// Wait until `needle` appears in the console after `from`, or timeout.
async function waitFor(needle, from, timeout = 120000) {
    const t0 = performance.now();
    while (performance.now() - t0 < timeout) {
        const i = buf.indexOf(needle, from);
        if (i >= 0) return i;
        await sleep(15);
    }
    throw new Error("timeout waiting for " + JSON.stringify(needle));
}

// The shell is ready once the boot + restore setup script has stopped producing
// output for a beat and a prompt has appeared. Then a handshake confirms it
// actually runs our input before we start timing.
async function waitShellReady() {
    const t0 = performance.now();
    while (performance.now() - t0 < 90000) {
        if (buf.includes("~ # ") && performance.now() - lastOut > 1200) break;
        await sleep(100);
    }
    // Quiet the tty so command echo doesn't muddy marker detection, then confirm.
    send("stty -echo 2>/dev/null; echo __READY__\n");
    await waitFor("__READY__", 0);
    buf = "";
}

let markerId = 0;
// Run one command, timed from send to its completion marker.
async function timeCmd(cmd) {
    const mark = "__M" + (++markerId) + "__";
    const from = buf.length;
    const t0 = performance.now();
    send(cmd + "; echo " + mark + "\n");
    await waitFor(mark, from);
    return performance.now() - t0;
}

async function bench(cmd, reps, label) {
    const runs = [];
    for (let i = 0; i < reps; i++) { status(`${label} — rep ${i + 1}/${reps}…`); runs.push(await timeCmd(cmd)); }
    return runs;
}

const COMPUTE = "awk 'BEGIN{s=0;for(i=0;i<2000000;i++)s+=i}'";
// Fork/alloc heavy — every process spins up a fresh address space (the
// clear_page target). Kept to a count that runs in a few seconds; fork/exec is
// the slow path, so even this is far heavier than the compute loop.
const FORKY = "i=0; while [ $i -lt 40 ]; do awk 'BEGIN{}'; i=$((i+1)); done";

function row(task, runs, notes) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${task}</td><td class="n">${fmt(median(runs))}</td><td class="n">${fmt(Math.min(...runs))}</td><td class="n">${fmt(Math.max(...runs))}</td><td>${notes||""}</td>`;
    $("results").querySelector("tbody").appendChild(tr);
    $("results").hidden = false;
}

async function runAll() {
    $("run").disabled = true;
    const reps = Math.max(3, Math.min(21, +$("reps").value || 7));
    $("results").querySelector("tbody").innerHTML = "";
    try {
        status("waiting for shell…");
        await waitShellReady();

        status("warming the JIT…");
        await timeCmd(COMPUTE);          // warm caches so timings aren't first-run
        await timeCmd(FORKY);

        row("compute (awk 2M-loop)", await bench(COMPUTE, reps, "compute"), "pure CPU, no forks");
        row("fork+alloc ×40", await bench(FORKY, reps, "fork+alloc"), "process spawn / page faults");

        status(`done — ${reps} reps each. Run again after any engine change and compare medians.`);
    } catch (e) {
        status("error: " + e.message);
        log("ERROR " + (e.stack || e.message));
    }
    $("run").disabled = false;
}

// The engine is up once the worker starts streaming console; enable the button.
const ready = setInterval(() => {
    if (buf.length > 0 || performance.now() > 4000) { clearInterval(ready); $("run").disabled = false; status("ready — click Run"); }
}, 200);
$("run").addEventListener("click", runAll);
</script>
</body>
</html>
